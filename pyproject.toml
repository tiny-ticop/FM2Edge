[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fm2edge"
version = "0.1.0"
description = "Machine-domain generalization experiments for lightweight semantic segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
tensorboard = ["tensorboard>=2.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
