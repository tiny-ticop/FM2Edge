name: machine_mobilenet_v3_lraspp
output_dir: results

data:
  root: data
  manifest: data/company/manifest.csv
  split: configs/splits/company/fold_01.yaml
  num_classes: 2
  ignore_index: 255
  image_size: [416, 640]
  mask_value_map:
    0: 0
    1: 1
    255: 255

model:
  name: mobilenet_v3_lraspp
  pretrained: null

train:
  epochs: 50
  batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  dice_weight: 1.0
  amp: true
  seed: 42
  device: cuda
  gradient_accumulation: 1
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
