name: synthetic_pretrained_distillation_smoke
output_dir: results/synthetic_phase5_5
cache_dir: results/foundation_feature_cache
feature_mode: cached
data:
  root: data/synthetic
  manifest: data/synthetic/manifest.csv
  splits_dir: configs/splits/synthetic
  num_classes: 2
  ignore_index: 255
  image_size: [56, 56]
  mask_value_map: {0: 0, 1: 1, 255: 255}
folds: [1]
seeds: [42]
students: [pidnet_s, mobilenet_v3_lraspp]
student_weights:
  pidnet_s: checkpoints/imagenet/pidnet_s_fm2edge.pt
  mobilenet_v3_lraspp: checkpoints/imagenet/mobilenet_v3_large_fm2edge.pt
teachers:
  dinov2:
    family: dinov2
    variant: vits14
    repository_path: external/dinov2
    weights_path: checkpoints/dinov2_vits14_pretrain.pth
    feature_layers: 4
    head: linear
  dinov3:
    family: dinov3
    variant: vits16
    repository_path: external/dinov3
    weights_path: checkpoints/dinov3_vits16_pretrain_lvd1689m.pth
    feature_layers: 4
    head: linear
methods:
  none: {}
  mgd: {mask_ratio: 0.5}
  heteroakd: {warmup_epochs: 0}
  gkd_cnn_source_only: {representation_epochs: 1, task_epochs: 1, max_tokens: 64}
training:
  epochs: 1
  batch_size: 2
  num_workers: 0
  device: cpu
  amp: false
  seed: 42
  early_stopping_patience: null
